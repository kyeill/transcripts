name: weekly transcript

on:
  schedule:
    # every 4 hours - first slot each day approximates 6am ET (DST drift is
    # harmless: the gate is "has the latest episode already been done?",
    # not wall-clock time, so a late run just means a later transcript,
    # never a duplicate or a skipped week)
    - cron: "0 10,14,18,22,2,6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WHISPER_MODEL: medium
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - run: python main.py

      - name: keep the raw transcript for offline alignment tuning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-transcript
          path: output/*.segments.json
          if-no-files-found: ignore

      - name: commit transcript if one was produced
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "nothing new - already up to date"
          else
            git commit -m "Add transcript [skip ci]"
            git push
          fi
